version: '3'

services:
  app:
    image: cqrs-image-editor:1.0
    build: ./backend
    ports:
      -- 3030:3030
  db:
    image: cqrs-image-db:1.0
    build: ./database
    container_name: postgres_pta
    ports:
      - 5432:5432
    volumes:
      - ./store/db:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: 'user'
      POSTGRES_PASSWORD: 'postgres'
volumes:
  db-store: